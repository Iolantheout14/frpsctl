name: CI

# 平台范围由设计文档 §3.4 决定：只支持 Linux，因此 CI 只有 Linux job。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 契约层需要真实 frps：CI 里按需下载并强校验（不缓存二进制，避免供应链漂移）
  FRPS_VERSION: "0.71.0"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: 静态分析
        run: .venv/bin/ruff check src/ tests/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前端模块（ESM 语法 + 纯逻辑真单测）
        run: |
          # v0.3.4：前端从单文件拆为 ESM 多模块——逐模块语法检查 +
          # node --test 直接 import 生产模块跑纯逻辑断言（tests/frontend/）。
          find src/frpsctl/web/static/js -name "*.js" -print0 \
            | xargs -0 -n1 node --input-type=module --check
          node --test tests/frontend/*.test.mjs

      - name: 拉取真实 frps + frpc（契约层用）
        run: |
          # 用我们自己的 install 下载 + sha256 强校验 —— 顺带验证 §8.6 的信任模型。
          # frpc 与 frps 在同一个 tar 包里，--with-frpc 不产生额外下载；
          # 插件的唯一真实调用方是 frpc，没有它就只能靠手工拼报文验证协议。
          .venv/bin/frpsctl install --version "$FRPS_VERSION" --with-frpc
          BIN="$HOME/.local/share/frpsctl/bin"
          echo "FRPSCTL_TEST_BINARY=$BIN/frps-${FRPS_VERSION}" >> "$GITHUB_ENV"
          echo "FRPSCTL_TEST_FRPC=$BIN/frpc-${FRPS_VERSION}" >> "$GITHUB_ENV"
          "$BIN/frps-${FRPS_VERSION}" -v
          "$BIN/frpc-${FRPS_VERSION}" -v

      - name: 单元 + 集成 + CLI 层（覆盖率门禁）
        run: |
          # 覆盖率门禁：非契约层的基线是 81%，低于 80% 视为回归（新增代码
          # 不应把已有覆盖挤掉）。契约层需要真二进制，单独跑、不进覆盖率。
          .venv/bin/pytest tests/ -q -m "not contract" \
            --cov=frpsctl --cov-report=term --cov-fail-under=80

      - name: 契约层（设计文档事实基线的自动化守卫）
        run: .venv/bin/pytest tests/test_facts.py -q

      - name: 故障注入层（异常路径的五项不变量）
        run: .venv/bin/pytest tests/test_faults.py -q

      - name: 插件契约层（真 frpc → 真 frps → 我们的插件）
        run: .venv/bin/pytest tests/test_plugin.py -q -m contract

      - name: 端到端冒烟（真 frps 全链路）
        run: |
          set -euo pipefail
          export FRPSCTL_ROOT="$RUNNER_TEMP/smoke/instances"
          export FRPSCTL_DATA_HOME="$RUNNER_TEMP/smoke/data"
          mkdir -p "$FRPSCTL_DATA_HOME/bin"
          cp "$FRPSCTL_TEST_BINARY" "$FRPSCTL_DATA_HOME/bin/"
          ln -sf "frps-${FRPS_VERSION}" "$FRPSCTL_DATA_HOME/bin/frps"

          free_port() { python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1])"; }
          BP=$(free_port); DP=$(free_port)

          .venv/bin/frpsctl init --no-input --bind-port "$BP" --dashboard-port "$DP" --allow-ports 6000-6100
          .venv/bin/frpsctl verify
          .venv/bin/frpsctl start --health-timeout 10
          .venv/bin/frpsctl status
          .venv/bin/frpsctl config set maxPortsPerClient 30
          .venv/bin/frpsctl status --json
          .venv/bin/frpsctl doctor
          # v0.2.6：doctor --json 的 counts 三键必须存在（可见性增强的冒烟面）
          .venv/bin/frpsctl doctor --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert set(d['counts']) == {'error','warn','info'}, d"
          # v0.2.6：策略级设置的结构化编辑（策略放实例目录——Web 审计视图按同一规则查找）
          .venv/bin/frpsctl plugin init
          .venv/bin/frpsctl plugin config set reject_log_burst 40
          .venv/bin/frpsctl plugin config list --json | python3 -c "import json,sys; assert json.load(sys.stdin)['settings']['reject_log_burst'] == 40"
          # v0.3.0：多键一次事务（CLI 与 Web 同语义）
          .venv/bin/frpsctl config apply --set maxPortsPerClient=25 --set bindPort="$BP"
          # v0.3.0：能力清单从代码派生，命令数不得缩水
          .venv/bin/frpsctl capabilities --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['commands']) >= 55, len(d['commands']); assert d['exit_codes']['PERMISSION'] == 8"
          .venv/bin/frpsctl stop
          .venv/bin/frpsctl status

      - name: Web 管理台冒烟（后台起服务 + HTTP 全流程）
        run: |
          set -euo pipefail
          export FRPSCTL_ROOT="$RUNNER_TEMP/smoke/instances"
          export FRPSCTL_DATA_HOME="$RUNNER_TEMP/smoke/data"
          WP=$(python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1])")
          .venv/bin/frpsctl web serve --bind "127.0.0.1:$WP" --password smoke-pw &
          WEB_PID=$!
          sleep 2
          python3 - "$WP" <<'EOF'
          import json, sys, urllib.error, urllib.request

          base = f"http://127.0.0.1:{int(sys.argv[1])}"
          login = urllib.request.Request(
              base + "/api/login", method="POST",
              data=json.dumps({"password": "smoke-pw"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(login, timeout=10) as resp:
              cookie = resp.headers["Set-Cookie"].split(";")[0]
              csrf = json.load(resp)["csrf"]

          def call(path):
              req = urllib.request.Request(base + path, headers={"Cookie": cookie})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  return json.load(resp)

          def post(path, body):
              req = urllib.request.Request(
                  base + path, method="POST",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "Cookie": cookie, "X-CSRF-Token": csrf},
              )
              with urllib.request.urlopen(req, timeout=10) as resp:
                  return json.load(resp)

          status = call("/api/status")
          assert status["state"] == "STOPPED", status
          assert call("/api/session")["csrf"] == csrf
          config = call("/api/config")
          assert any(item["key"] == "bindPort" for item in config["entries"]), config
          history = call("/api/config/history")
          assert isinstance(history["entries"], list), history
          # 端到端冒烟里的 config set 会留下快照：history 必须真的读得到
          # （只断言"是列表"的话，空列表也能骗过这层守卫）。
          assert any(str(e.get("action", "")).startswith("set ") for e in history["entries"]), history
          # 回滚前的"看差异"：先经 API 改一个键（实例未运行 → 只写不重启），
          # 再断言差里真的出现它。
          preview = post("/api/config/preview", {"changes": [["maxPortsPerClient", "35"]]})
          applied = post("/api/config/apply", {"preview_id": preview["preview_id"]})
          assert applied["applied"] is True, applied
          diff = call("/api/config/history/1/diff")
          assert "maxPortsPerClient" in diff["diff"], diff
          favicon = urllib.request.urlopen(base + "/favicon.ico", timeout=10)
          assert favicon.status == 204
          html = urllib.request.urlopen(base + "/", timeout=10).read().decode("utf-8")
          assert "frpsctl 管理台" in html
          # v0.2.6：只读体检（counts 三键）与审计视图（策略已由 CLI 冒烟生成于实例目录）
          doctor = call("/api/doctor")
          assert set(doctor["counts"]) == {"error", "warn", "info"}, doctor
          audit = call("/api/audit")
          assert audit["available"] is True and audit["path"].endswith("plugin-audit.jsonl"), audit
          # 统计类端点在实例未运行时报 502（dashboard 不可达）——语义化错误契约
          try:
              call("/api/traffic")
              raise AssertionError("实例未运行时 /api/traffic 应当 502")
          except urllib.error.HTTPError as exc:
              assert exc.code == 502, exc.code
          print("web 冒烟通过：login / session / status / config / history / diff / doctor / audit / traffic-502 / favicon / 静态页")
          EOF
          kill "$WEB_PID"
          wait "$WEB_PID" 2>/dev/null || true

  no-binary:
    name: 无二进制降级路径（Python 3.13）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 安装依赖
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: 契约层必须整体 skip 而不是失败
        run: .venv/bin/pytest tests/test_facts.py -q -rs

  contract-070:
    name: 契约层（frp 0.70.0 下界）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 安装依赖
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: 版本门槛下界的契约验证
        run: |
          # 支持范围的下界必须与上界一样可信：§3.6 的门槛是 0.70.0，
          # 契约层就在这里把它变成可执行断言（本机已实测 21/21 通过）。
          export FRPSCTL_DATA_HOME="$RUNNER_TEMP/data070"
          .venv/bin/frpsctl install --version 0.70.0
          FRPSCTL_TEST_BINARY="$RUNNER_TEMP/data070/bin/frps-0.70.0" \
            .venv/bin/pytest tests/test_facts.py -q
