[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frpsctl"
# 版本号单一来源：hatchling 从 src/frpsctl/__init__.py 的 __version__ 读取。
# 两处硬编码（pyproject + __init__）迟早会漂移，而发布物的版本必须是唯一的。
dynamic = ["version"]
description = "把 frp 服务端（frps）包装成命令行工具：配置翻译器 + 进程保镖 + 状态聚合器"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    # click 是 typer 的底座，但我们要直接用它来决定退出码，因此显式声明依赖
    "click>=8.0",
    "pydantic>=2.7",
    "tomlkit>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/frpsctl"
Repository = "https://github.com/ThzxxArt/frpsctl"
Changelog = "https://github.com/ThzxxArt/frpsctl/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/frpsctl/__init__.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    # README 让开发者跑 `ruff check`，dev 依赖里就必须有它——否则那条命令
    # 在干净的开发环境里直接是 command not found。
    "ruff>=0.6",
]

[project.scripts]
frpsctl = "frpsctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frpsctl"]

[tool.ruff]
# 110 而不是 100：本项目的注释与文档表格是中文，每字占两列宽，
# 100 列会把正常的说明文字频繁判为超长，反而促使大家把注释写短写糊。
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "RET", "C4", "ARG", "PTH", "S"]
ignore = [
    # B008：Typer/Click 的官方用法就是把 typer.Option(...) 写在默认值位置，
    # 这是框架约定而非缺陷；抑制它以免噪音掩盖真正的问题。
    "B008",
    # S603/S607：我们确实要执行外部程序（frps / systemctl / tail / curl），
    # 且参数全部来自本工具自身构造，非用户拼接的 shell 字符串。
    "S603",
    "S607",
    # S104：0.0.0.0 出现在"检测到用户配了非回环地址"的告警逻辑里，不是绑定动作。
    "S104",
    # S101：assert 用在内部不变量（状态机自检）上，配合 -O 也不会影响正确性。
    "S101",
    # PTH：Path 与 os.path 混用是历史遗留，不构成缺陷。
    "PTH",
]

[tool.ruff.lint.per-file-ignores]
# 测试里断言宽泛、参数未用、硬编码口令都是刻意的
"tests/*" = ["ARG001", "ARG002", "S105", "S106", "S108", "B011"]
# cli/__init__.py 是兼容 shim：集中 re-export 命令符号（一个版本周期后收敛）
"src/frpsctl/cli/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: 契约层测试，需要真实 frps 二进制（缺失时 skip）",
    "integration: 集成层测试，起真实进程",
]
