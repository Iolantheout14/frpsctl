[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frpsctl"
version = "0.1.0"
description = "把 frp 服务端（frps）包装成命令行工具：配置翻译器 + 进程保镖 + 状态聚合器"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    # click 是 typer 的底座，但我们要直接用它来决定退出码，因此显式声明依赖
    "click>=8.0",
    "pydantic>=2.7",
    "tomlkit>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
frpsctl = "frpsctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frpsctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: 契约层测试，需要真实 frps 二进制（缺失时 skip）",
    "integration: 集成层测试，起真实进程",
]
